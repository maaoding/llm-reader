<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LLM Reader 是一款本地优先、以原文为锚点的 Windows 桌面阅读器。"
    />
    <meta name="theme-color" content="#eef1f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e282d" media="(prefers-color-scheme: dark)" />
    <title>LLM Reader — 本地优先的 AI 阅读器</title>
    <link rel="icon" href="./icon.png" type="image/png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <nav class="nav" aria-label="主导航">
        <a class="brand" href="./" aria-label="LLM Reader 首页">
          <img class="brand-mark" src="./icon.png" alt="" />
          <span class="brand-copy">
            <strong>LLM Reader</strong>
          </span>
        </a>
        <a class="nav-link" href="https://github.com/maaoding/llm-reader">GitHub</a>
      </nav>

      <section class="hero" aria-labelledby="page-title">
        <h1 id="page-title">理解，始终锚定<br />在原文之中。</h1>
        <div class="actions">
          <a class="button button-primary" href="https://github.com/maaoding/llm-reader">前往 GitHub</a>
        </div>
      </section>

      <section class="features" aria-label="核心能力">
        <article class="feature-card">
          <span class="feature-number">01</span>
          <div class="feature-icon feature-icon-book" aria-hidden="true"><span></span><span></span></div>
          <h2>导入并阅读</h2>
          <p>EPUB 与 TXT</p>
        </article>
        <article class="feature-card">
          <span class="feature-number">02</span>
          <div class="feature-icon feature-icon-anchor" aria-hidden="true"><span></span><span></span></div>
          <h2>围绕原文提问</h2>
          <p>解释、追问与引用</p>
        </article>
        <article class="feature-card">
          <span class="feature-number">03</span>
          <div class="feature-icon feature-icon-local" aria-hidden="true"><span></span><span></span></div>
          <h2>把阅读留在本机</h2>
          <p>书籍、进度与收藏</p>
        </article>
      </section>
    </main>
  </body>
</html>
