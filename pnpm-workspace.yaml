packages:
  - .
  - docs

overrides:
  '@xmldom/xmldom': 0.8.15
  js-yaml: 4.3.2
  fast-uri: 3.1.8
  http-cache-semantics: 4.3.0
  source-map-js: 1.2.2
  'brace-expansion@1': 1.1.21
  'brace-expansion@2': 2.1.7
  'brace-expansion@5': 5.0.12
  'undici@6': 6.29.0
  'undici@7': 7.30.0
  'undici@8': 8.11.2

# Reviewed stable release needed for the Vite 8 migration; keep the exception version-specific.
minimumReleaseAgeExclude:
  - electron-vite@6.0.0

allowBuilds:
  core-js: true
  electron: true
  electron-winstaller: true
  es5-ext: true
  esbuild: true
