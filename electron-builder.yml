appId: com.llmreader.desktop
productName: LLM Reader
directories:
  buildResources: resources
  output: release
publish:
  provider: github
  owner: maaoding
  repo: llm-reader
files:
  - out/**
  - package.json
extraResources:
  - from: resources/icon.ico
    to: icon.ico
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
asar: true
npmRebuild: false
mac:
  icon: resources/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: LLM-Reader-${version}-${arch}.${ext}
dmg:
  title: ${productName} ${version}
  artifactName: LLM-Reader-${version}-${arch}.${ext}
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: LLM-Reader-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
