name: Build installers (Windows + macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (NSIS)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm build:app && pnpm exec electron-builder --win nsis --publish never

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  build-macos:
    name: macOS (DMG + ZIP)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS installers
        run: pnpm build:app && pnpm exec electron-builder --mac dmg zip --arm64 --x64 --publish never

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  release:
    name: Publish installers to GitHub Release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/windows

      - name: Download macOS installers
        uses: actions/download-artifact@v4
        with:
          name: macos-installers
          path: dist/macos

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows/*
            dist/macos/*
          generate_release_notes: true
