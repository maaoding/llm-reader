name: Windows AppX validation

on:
  pull_request:
    paths:
      - .github/workflows/windows-package-validation.yml
      - electron-builder.yml
      - electron.vite.config.ts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - resources/**
      - src/**
      - scripts/validate-appx.ps1
      - scripts/validate-restore-relaunch.mjs
      - tests/fixtures/complex-reading.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and check the Windows AppX
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Enable Corepack and install pinned pnpm
        run: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack install
      - name: Install dependencies and Electron
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/electron/install.js
      - name: Build AppX without publishing
        run: pnpm --config.verify-deps-before-run=error build:store
      - name: Verify AppX manifest, resources and license files
        run: ./scripts/validate-appx.ps1
      - name: Verify backup restore relaunch in the unpacked application
        run: node scripts/validate-restore-relaunch.mjs --root release/store --executable "release/store/win-unpacked/LLM Reader.exe" --fixture tests/fixtures/complex-reading.txt
      - name: Upload validation results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-appx-validation
          path: |
            release/store/appx-validation.json
            release/store/restore-relaunch.json
            release/store/restore-relaunch.png
          if-no-files-found: warn
          retention-days: 7
